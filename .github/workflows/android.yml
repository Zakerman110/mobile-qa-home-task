name: Android UI tests
on: [push, pull_request, workflow_dispatch]
jobs:
  fork-pr-summary:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - run: echo "Android UI tests skipped on this fork PR because the APK secret is unavailable." >> "$GITHUB_STEP_SUMMARY"
  android-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare assignment APK
        env:
          APK_PATH: ${{ secrets.APK_PATH }}
        run: |
          if [[ ! -s app/app-debug.apk && -n "$APK_PATH" ]]; then
            mkdir -p app
            curl --fail --silent --show-error --location --retry 2 \
              --proto '=https' --proto-redir '=https' --output app/app-debug.apk -- "$APK_PATH"
          fi
          if [[ ! -s app/app-debug.apk ]]; then
            echo "::error::APK missing. Set the APK_PATH secret to an authorized HTTPS APK download."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Appium and UiAutomator2
        run: |
          npm install -g appium@3.9.1
          appium driver install uiautomator2@8.6.0
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_8
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            appium --log appium-server.log &
            for i in $(seq 1 45); do
              if curl -fsS http://127.0.0.1:4723/status | jq -e '.value.ready == true' >/dev/null; then break; fi
              sleep 2
            done
            curl -fsS http://127.0.0.1:4723/status | jq -e '.value.ready == true' >/dev/null || exit 1
            bash gradlew test -PtestGroup=smoke --no-daemon
      - name: Optional AI failure triage
        if: failure()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/ai_failure_summary.py artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-diagnostics
          path: |
            artifacts/
            build/reports/tests/
            build/test-results/
            appium-server.log
          if-no-files-found: ignore
