name: Android UI tests
on: [push, pull_request, workflow_dispatch]
jobs:
  fork-pr-summary:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - run: echo "Android UI tests skipped on this fork PR because the APK secret is unavailable." >> "$GITHUB_STEP_SUMMARY"
  android-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare assignment APK
        env:
          APK_PATH: ${{ secrets.APK_PATH }}
        run: |
          if [[ ! -s app/app-debug.apk && -n "$APK_PATH" ]]; then
            mkdir -p app
            curl --fail --silent --show-error --location --retry 2 \
              --proto '=https' --proto-redir '=https' --output app/app-debug.apk -- "$APK_PATH"
          fi
          if [[ ! -s app/app-debug.apk ]]; then
            echo "::error::APK missing. Set the APK_PATH secret to an authorized HTTPS APK download."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Appium and UiAutomator2
        run: |
          npm install -g appium@3.9.1
          appium driver install uiautomator2@8.6.0
      - name: Configure Android emulator acceleration
        id: emulator-acceleration
        run: |
          if [[ -c /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm --settle
          fi
          if [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]; then
            echo "mode=on" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KVM unavailable. Starting the Android emulator in software CPU emulation mode (-accel off)."
            echo "mode=off" >> "$GITHUB_OUTPUT"
          fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_8
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel ${{ steps.emulator-acceleration.outputs.mode }}
          script: bash scripts/run-android-smoke.sh
      - name: Summarize Android smoke tests
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          from xml.etree import ElementTree

          suites = [
              ElementTree.parse(file).getroot()
              for file in Path("build/test-results/test").glob("TEST-*.xml")
          ]
          print("### Android smoke tests\n")
          if not suites:
              print("No test results were produced. See the job logs.")
          else:
              total, failures, errors, skipped = (
                  sum(int(suite.get(key, 0)) for suite in suites)
                  for key in ("tests", "failures", "errors", "skipped")
              )
              failed = failures + errors
              print(f"**{total - failed - skipped}/{total} passed** · {failed} failed · {skipped} skipped")
          PY
      - name: Generate Allure report
        if: always() && hashFiles('build/allure-results/*-result.json') != ''
        run: npx --yes allure-commandline@2.42.0 generate build/allure-results --clean --single-file --output build/allure-report
      - name: Upload Allure report
        if: always() && hashFiles('build/allure-report/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: build/allure-report/index.html
      - name: Optional AI failure triage
        if: failure()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/ai_failure_summary.py artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-diagnostics
          path: |
            artifacts/
            build/reports/tests/
            build/test-results/
            appium-server.log
          if-no-files-found: ignore
